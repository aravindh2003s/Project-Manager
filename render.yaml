databases:
  - name: pms-db
    databaseName: pms
    user: pms_user
    plan: free

services:
  - type: web
    name: pms-backend
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pms-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: pms-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pms-backend
          envVarKey: RENDER_EXTERNAL_URL
