databases:
  - name: pms-db
    databaseName: pms
    user: pms_user
    plan: free

services:
  - type: web
    name: pms-backend
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pms-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://project-manager-five-zeta.vercel.app
